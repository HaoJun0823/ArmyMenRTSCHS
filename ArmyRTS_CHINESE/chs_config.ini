; ArmyMenRTS 汉化 ASI 配置
; 放在与 ArmyRTS_CHINESE.asi 同目录

[Font]
; 微软雅黑（推荐，小字号清晰）。也可用 simsun.ttc
Path=C:\Windows\Fonts\msyh.ttc

; 字号需匹配游戏字体：
;   font_arial_10 -> 10   (System/Console/Button/HeaderSmall)
;   font_stencil_14 -> 14 (Debriefing)
;   font_stencil_24 -> 24 (Movie/Resource)
Size=14

[Hook]
; 地址来自 IDA 对 STEAM 版 amrts.exe (md5 a28b3085346fdfe483b0395bdf9bad5f)
; 换 exe 版本需重新定位
; 文本测宽 int __thiscall sub_4A2650(Font*, const char*, int)
; 只 hook 这一个函数：字形查表改为内联内存读取，避免递归
Measure=0x4A2650

; 文本绘制 int __thiscall sub_4A2C50(Font*, int x, int y, char* str, uint len,
;                                   float color, int* clip, float alpha) ret 0x1C
Draw=0x4A2C50

; 引擎"销毁全部纹理"的入口 sub_4A5A30。它有两个调用者：
;   sub_4A5AF0  销毁后重建所有已注册字体
;   sub_4A5940  销毁后不重建字体（进入 3D 世界走这条，所以之前只 hook
;               4A5AF0 从来没触发过）
; 我们的汉字纹理页在这里被释放，字形记录里的 tex id 随即失效，继续绘制
; 会采样到别人的纹理 -> 实心方块。hook 后丢弃 atlas，下一次绘制时按新的
; 纹理编号重建。
; 序言 56 57 BE <imm32> BF <imm32>，无 rel32 需要重定位。
ResetFonts=0x4A5A30

[Atlas]
; 索引文件名（与 asi 同目录）
Index=chs_index.bin

; 汉字整体像素微调。测宽与绘制的 advance 已统一，所以这里只补偿
; TTF 侧边距与引擎预期的固定差值 —— 它必须是常数，不能随字数增长。
; 若文字整体偏左就加大 OffsetX；偏下就减小 OffsetY。
OffsetX=0
OffsetY=0
